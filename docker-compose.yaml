services:
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  reverse-proxy:
    image: traefik:v3.5
    command: --api.insecure=true --api.debug=true --providers.file.filename=/etc/traefik/dynamic.yaml
    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./example/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./example/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - .:/plugins-local/src/github.com/MichNG/traefik-distributed-rate-limit/

  target:
    image: traefik/whoami
    ports:
      - "80"
