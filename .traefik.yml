displayName: Traefik Distributed Rate Limit
type: middleware
iconPath: .assets/speedlimit.png

import: github.com/MichNG/traefik-distributed-rate-limit

summary: 'Traefik Distributed Rate Limit: the token bucket state is stored in a shared Redis store (single instance or Sentinel), so the rate limit is enforced cluster-wide. Configuration follows the Traefik Hub Distributed RateLimit schema (limit/period/burst/denyOnError/store.redis.*).'

testData:
  limit: 100
  period: 1s
  burst: 200
  denyOnError: true
  responseHeaders: true
  store:
    redis:
      endpoints:
        - redis:6379
