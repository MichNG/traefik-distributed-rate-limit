# 10-routers.yaml - the wiring of this directory
#
# Traefik instantiates a middleware when a router uses it: a middleware that no
# router references is never built, so a configuration error inside it goes
# unreported (the API even reports such a middleware as enabled). This file
# references every middleware of the directory exactly once, so that
# hack/options/run.sh can assert, for real:
#
#   * a positive middleware is created (status "enabled", no error) - every
#     option and every variant of its value is exercised this way;
#   * a negative middleware is refused (status "disabled" with the documented
#     error) - the router that uses it then answers 404 and never reaches the
#     backend.
#
# The routers also give every middleware a stable URL, which the behavioural
# checks of the stand and the table of docs/18-options.md point at:
#
#   http://localhost:29000/mw/<middleware name>
#
http:
  routers:
    opt-rate-defaults:
      rule: "Host(`localhost`) && PathPrefix(`/mw/rate-defaults`)"
      entryPoints: [web]
      middlewares: [rate-defaults]
      service: options-target

