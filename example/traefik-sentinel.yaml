# traefik-sentinel.yaml
#
# Static configuration used by docker-compose.sentinel.yaml.

entryPoints:
  web:
    address: ":8000"

providers:
  file:
    filename: "/etc/traefik/dynamic-sentinel.yaml"

api:
  dashboard: true
  insecure: true  # development only

log:
  level: DEBUG
  format: common

experimental:
  localPlugins:
    distributedRateLimit:
      moduleName: github.com/MichNG/traefik-distributed-rate-limit
